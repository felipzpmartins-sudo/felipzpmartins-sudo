<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f0c27b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="858" height="278" rx="14" fill="url(#bg)" stroke="#22304a"/>

  <rect x="1" y="1" width="858" height="38" rx="14" fill="#0b1220"/>
  <rect x="1" y="26" width="858" height="13" fill="#0b1220"/>
  <line x1="1" y1="39" x2="859" y2="39" stroke="#22304a"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="430" y="25" font-family="monospace" font-size="13" fill="#6b7a90" text-anchor="middle">felipe@dev ~ aprendendo</text>

  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="17">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.08;0.85;0.93;0.97;1" dur="12s" repeatCount="indefinite"/>
      <text x="38" y="85" fill="#58a6ff">$</text>
      <text x="60" y="85" fill="#e6edf3">whoami</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.14;0.2;0.85;0.97;1" dur="12s" repeatCount="indefinite"/>
      <text x="38" y="120" fill="#7ee787">felipe martins</text>
      <text x="210" y="120" fill="#6b7a90">// front-end em formação</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.3;0.36;0.85;0.97;1" dur="12s" repeatCount="indefinite"/>
      <text x="38" y="163" fill="#58a6ff">$</text>
      <text x="60" y="163" fill="#e6edf3">cat stack.txt</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.44;0.5;0.85;0.97;1" dur="12s" repeatCount="indefinite"/>
      <text x="38" y="198" fill="#f0c27b">html</text>
      <text x="90" y="198" fill="#6b7a90">·</text>
      <text x="106" y="198" fill="#f0c27b">css</text>
      <text x="146" y="198" fill="#6b7a90">·</text>
      <text x="162" y="198" fill="#f0c27b">javascript</text>
      <text x="280" y="198" fill="#6b7a90">// um pouco melhor a cada dia</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.66;0.97;1" dur="12s" repeatCount="indefinite"/>
      <text x="38" y="238" fill="#58a6ff">$</text>
      <text x="60" y="238" fill="#e6edf3">git commit -m "dia 1 de muitos"</text>
    </g>
  </g>

  <rect x="466" y="224" width="11" height="19" fill="#58a6ff">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1;0" keyTimes="0;0.66;0.7;0.76;0.82;0.88;0.94;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="276" width="200" height="3" fill="url(#sweep)">
    <animate attributeName="x" values="-200;860" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g fill="#58a6ff" opacity="0.5">
    <circle cx="760" cy="90" r="3">
      <animate attributeName="cy" values="90;70;90" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="140" r="2.5" fill="#f0c27b">
      <animate attributeName="cy" values="140;115;140" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="190" r="2">
      <animate attributeName="cy" values="190;168;190" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
